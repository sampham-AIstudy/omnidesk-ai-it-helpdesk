<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
            </svg>
          </div>
          <span>Nova</span>
        </div>
        <button id="newChatBtn" class="new-chat-btn" title="New chat">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>New chat</span>
        </button>
      </div>

      <nav id="conversationList" class="conversation-list">
        <p class="empty-conv" id="emptyConv">No conversations yet</p>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-chip">
          <div class="avatar">N</div>
          <div class="user-info">
            <span class="user-name">Nguyen Van A</span>
            <span class="user-plan">Pro</span>
          </div>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="chatHeader" class="chat-header hidden">
        <div class="header-title">
          <h1 id="headerTitle">New chat</h1>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="themeBtn" title="Toggle theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a9 9 0 0 0 0 18 7 7 0 0 0 0-18Z"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="chatArea" class="chat-area">
        <div id="welcome" class="welcome">
          <div class="welcome-inner">
            <div class="welcome-mark">
              <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
              </svg>
            </div>
            <h2>How can I help you today?</h2>
            <p class="welcome-sub">I'm Nova, your AI assistant. Ask me anything.</p>
            <div class="suggestion-grid">
              <button class="suggestion-card" data-prompt="Help me plan a trip to Da Nang for 3 days">
                <span class="sugg-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12h4l3-8 4 16 3-8h4"/>
                  </svg>
                </span>
                <span class="sugg-text">Plan a trip to Da Nang for 3 days</span>
              </button>
              <button class="suggestion-card" data-prompt="Write a Python script to sort files into folders by extension">
                <span class="sugg-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <path d="M9 9h6M9 13h6M9 17h4"/>
                  </svg>
                </span>
                <span class="sugg-text">Sort files into folders by extension</span>
              </button>
              <button class="suggestion-card" data-prompt="Summarize the key differences between React and Vue in 2026">
                <span class="sugg-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>
                    <path d="M3 12h18"/>
                  </svg>
                </span>
                <span class="sugg-text">React vs Vue in 2026</span>
              </button>
              <button class="suggestion-card" data-prompt="Explain how photosynthesis works in simple terms">
                <span class="sugg-icon">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v12M8 7l4-4 4 4"/>
                    <path d="M4 21h16"/>
                    <path d="M6 17h12"/>
                  </svg>
                </span>
                <span class="sugg-text">How does photosynthesis work?</span>
              </button>
            </div>
          </div>
        </div>

        <div id="messages" class="messages"></div>
      </section>

      <footer id="composer" class="composer">
        <div class="composer-inner">
          <div class="input-shell">
            <textarea id="userInput" rows="1" placeholder="Message Nova..." aria-label="Message Nova"></textarea>
            <div class="composer-tools">
              <button class="icon-btn" id="attachBtn" title="Attach file">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.4 11.1l-9.3 9.3a5 5 0 0 1-7-7l9.3-9.3a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.6-8.6"/>
                </svg>
              </button>
              <button class="send-btn" id="sendBtn" title="Send message" aria-label="Send message">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
              </button>
            </div>
          </div>
          <p class="composer-hint">Nova can make mistakes. Check important info.</p>
        </div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
