[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--basetemp=./data/pytest_temp"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "behavior_gate: Critical chat behavior regression test suite",
    "critical_multiturn: Critical multi-turn conversation flow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
extraPaths = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "jose.*",
    "google.genai.*",
    "upstash_redis.*",
    "sklearn.*",
    "datasets.*",
    "pandas.*",
    "langchain_groq.*",
    "langgraph.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.services.rag_service",
    "src.services.zero_mem_service",
    "src.services.duplicate_detection_service",
    "src.services.bm25_retriever",
]
ignore_errors = true

